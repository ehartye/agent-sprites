name: Showcase Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'examples/**'
      - 'skills/**'
      - 'server/commands/catalog.js'
      - 'server/web/public/js/**'
      - 'server/engine/composition.js'
      - 'server/engine/patterns.js'
      - 'server/build/ui-runtime.mjs'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'examples/**'
      - 'skills/**'
      - 'server/commands/catalog.js'
      - 'server/web/public/js/**'
      - 'server/engine/composition.js'
      - 'server/engine/patterns.js'
      - 'server/build/ui-runtime.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showcase-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node site/build.mjs
      - run: node site/test.mjs
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
