name: Native compatibility

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the change set with scripts/native-admission.mjs. Releases and manual
  # dispatches always admit the native matrix; so do native and unknown change sets.
  admit:
    name: Classify change set
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      class: ${{ steps.admit.outputs.class }}
      native: ${{ steps.admit.outputs.native }}
      identity: ${{ steps.admit.outputs.identity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Classify the change set
        id: admit
        env:
          ADMIT_EVENT: ${{ github.event_name }}
          ADMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ADMIT_HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: node scripts/native-admission.mjs classify --event "$ADMIT_EVENT" --base "$ADMIT_BASE" --head "$ADMIT_HEAD"

  # Version-only changes skip the matrix; the four version files must still agree.
  identity:
    name: Version identity
    needs: admit
    if: needs.admit.outputs.identity == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check the four version files carry the same version
        run: node scripts/native-admission.mjs check-identity

  native:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    needs: admit
    if: needs.admit.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: ['24', '26']
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    env:
      npm_config_ignore_scripts: 'false'
      npm_config_include: optional
      NATIVE_RUNNER_LABEL: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Record source and prepare private runtime paths
        run: node .github/scripts/native-compatibility.mjs prepare
      - name: Install with optional packages and native scripts enabled
        id: install
        run: npm ci --include=optional --ignore-scripts=false --no-audit --no-fund
      - name: Exercise Canvas, SQLite and Sharp bindings
        id: dependencies
        run: node .github/scripts/native-compatibility.mjs dependencies
      - name: DB, raster, artifact integrity, publication, managed and owned PNG controls
        id: tests
        run: >-
          node node_modules/vitest/vitest.mjs run tests/db
          tests/engine/raster.test.js tests/engine/canvas-renderer.test.js
          tests/engine/atlas-verifier.test.js
          tests/engine/shared-geometry.test.js tests/engine/shared-validation-work.test.js
          tests/io/bounded-input.test.js
          tests/web/project-import-api.test.js tests/web/project-import-shutdown.test.js
          tests/web/progressive-project.test.js
          tests/web-ui/native-frame-raster.test.js tests/web-ui/native-frame-consumers.test.js
          tests/cli/generator-input.test.js tests/cli/generator-build.test.js
          tests/cli/project-import.test.js
          tests/engine/environment-modules.test.js tests/cli/managed-runtime.test.js
          tests/cli/managed-invocation.test.js tests/cli/owned-child-process.test.js
          tests/cli/owned-cli.test.js
          tests/cli/native-compatibility-receipt.test.js
          tests/cli/build-manifest.test.js tests/cli/project-set.test.js
          tests/cli/build-publication.test.js tests/cli/tileset-crop.test.js
          tests/cli/ui-build.test.js
          tests/cli/view-png-real-server.test.js --maxWorkers=2
          --reporter=default --reporter=json --outputFile.json="$NATIVE_RECEIPT_DIR/targeted-tests.json"
      - name: Install, check and launch the managed release
        id: managed
        run: node .github/scripts/native-compatibility.mjs managed
      - name: Record step outcomes
        if: always()
        env:
          NATIVE_INSTALL_RESULT: ${{ steps.install.outcome }}
          NATIVE_DEPENDENCIES_RESULT: ${{ steps.dependencies.outcome }}
          NATIVE_TESTS_RESULT: ${{ steps.tests.outcome }}
          NATIVE_MANAGED_RESULT: ${{ steps.managed.outcome }}
        run: node .github/scripts/native-compatibility.mjs receipt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: native-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/sprite-native-receipts
          if-no-files-found: error
          retention-days: 14
