# agent-tests risk map. Confirm or edit, then commit it.
# First matching area wins, so list specific areas before broad ones.
# consumers: who depends on this code, and which compatibility obligations exist?
# Current missing/invalid-input handling can need coverage without legacy consumers.
phase: dev
# No backward compatibility is expected at this time (owner decision): consumers below
# are named for awareness, not as a standing compatibility obligation.
consumers:
  - plugin installs from the marketplace
  - projects that read the exported atlas
weights:
  wait: 1
  agent: 1
  ci: 1
  churn: 1
lanes:
  edit:
    runs: affected-files
    trigger: agent-edit
  merge:
    runs: critical+standard
    trigger: local-pre-push
  scheduled:
    runs: all
    trigger: cron
    os:
      - ubuntu
      - windows
      - macos
  release:
    runs: all+clean-install
    trigger: tag
    os:
      - ubuntu
      - windows
      - macos
areas:
  - path: assets/**
    tier: low
    why: presentation or example code; confirm
  - path: examples/**
    tier: low
    why: presentation or example code; confirm
  - path: recipes/**
    tier: standard
    why: no risk keyword in the name; confirm
  - path: scripts/**
    tier: standard
    why: owner kept this out of the critical tier in the first audit; default tier for other server paths
  - path: server/authoring/**
    tier: standard
    why: no risk keyword in the name; confirm
  - path: server/build/**
    tier: standard
    why: owner kept this out of the critical tier in the first audit; default tier for other server paths
  - path: server/commands/**
    tier: standard
    why: no risk keyword in the name; confirm
  - path: server/db/**
    tier: critical
    why: name suggests data persistence; confirm
  - path: server/engine/**
    tier: standard
    why: no risk keyword in the name; confirm
  - path: server/handlers/**
    tier: standard
    why: no risk keyword in the name; confirm
  - path: server/import/**
    tier: standard
    why: no risk keyword in the name; confirm
  - path: server/io/**
    tier: standard
    why: no risk keyword in the name; confirm
  - path: server/web/**
    tier: standard
    why: no risk keyword in the name; confirm
  - path: site/**
    tier: standard
    why: no risk keyword in the name; confirm
  - path: skills/**
    tier: standard
    why: no risk keyword in the name; confirm
