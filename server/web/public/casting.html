<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frame Casting · Agent Sprites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/casting.css">
</head>
<body>
  <header id="top-bar">
    <h1>Agent Sprites</h1>
    <span id="project-name">Frame Casting</span>
    <div id="top-bar-right">
      <button id="theme-toggle" title="Toggle light/dark mode">☀</button>
    </div>
  </header>

  <main id="casting-main">
    <p class="subtitle" id="subtitle">loading…</p>

    <section id="preview-bar" hidden>
      <h2>Live preview</h2>
      <div id="previews" style="display:flex;gap:1rem;flex-wrap:wrap"></div>
      <label id="preview-speed">fps <input id="fps" type="range" min="2" max="16" value="8"><span id="fps-val">8</span></label>
    </section>

    <details id="provenance" hidden>
      <summary>Generation prompt &amp; settings</summary>
      <div id="gen-meta"></div>
      <pre id="gen-prompt"></pre>
    </details>

    <div id="slots"></div>

    <div id="actions">
      <button id="save">Save selections</button>
      <span class="subtitle" style="margin:0">Selections apply to the preview immediately.</span>
    </div>
    <div id="result"></div>
  </main>

<script>
/* -- Theme (shared convention with the editor: localStorage 'sprites-theme') -- */
const savedTheme = localStorage.getItem('sprites-theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
const themeBtn = document.getElementById('theme-toggle');
themeBtn.textContent = savedTheme === 'dark' ? '☀' : '◑';
themeBtn.onclick = () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('sprites-theme', next);
  themeBtn.textContent = next === 'dark' ? '☀' : '◑';
};

const id = new URLSearchParams(location.search).get('id');
const selections = {};
const images = new Map();   // candidate id -> HTMLImageElement
let session, fps = 8;

const imgUrl = (cid) => `/api/casting/${id}/candidate/${cid}.png`;

async function load() {
  const res = await fetch(`/api/casting/${id}`);
  if (!res.ok) { document.getElementById('subtitle').textContent = 'session not found'; return; }
  session = (await res.json()).data;
  document.getElementById('subtitle').innerHTML =
    `<b>${session.title}</b> — ${session.slots.length} slots, ${session.candidates.length} candidates. ` +
    `<span class="star">★</span> is the predicted pick; click any frame to override, <b>⇋</b> selects it mirrored, ` +
    `the dashed box marks a gap to generate.`;

  // preload candidate images once, reuse for cards and preview canvases
  await Promise.all(session.candidates.map((c) => new Promise((resolve) => {
    const im = new Image();
    im.onload = im.onerror = () => { images.set(c.id, im); resolve(); };
    im.src = imgUrl(c.id);
  })));

  const root = document.getElementById('slots');
  for (const slot of session.slots) {
    selections[slot.id] = session.predictions[slot.id] ?? 'gap';
    const div = document.createElement('div');
    div.className = 'slot';
    div.innerHTML = `<h2><span class="slot-id">${slot.id}</span>${slot.label}` +
      `<span class="pick" id="pick-${slot.id}"></span></h2>`;
    const strip = document.createElement('div');
    strip.className = 'strip';
    for (const c of session.candidates) {
      const el = document.createElement('div');
      el.className = 'cand' + (c.isNew ? ' is-new' : '');
      el.dataset.slot = slot.id; el.dataset.cand = c.id;
      el.innerHTML = `<img src="${imgUrl(c.id)}" alt="${c.id}">` +
        `<span class="flip" title="select mirrored">⇋</span><span class="tag">${c.label ?? c.id}</span>`;
      const pred = session.predictions[slot.id] ?? '';
      if (pred.split(':')[0] === c.id) {
        el.classList.add('predicted', 'selected');
        if (pred.endsWith(':flip')) el.classList.add('flipped');
      }
      el.onclick = () => select(slot.id, c.id);
      el.querySelector('.flip').onclick = (ev) => { ev.stopPropagation(); select(slot.id, `${c.id}:flip`); };
      strip.appendChild(el);
    }
    const gap = document.createElement('div');
    gap.className = 'gapbtn';
    gap.dataset.slot = slot.id; gap.dataset.cand = 'gap';
    gap.textContent = 'GAP — generate';
    if (selections[slot.id] === 'gap') gap.classList.add('selected');
    gap.onclick = () => select(slot.id, 'gap');
    strip.appendChild(gap);
    div.appendChild(strip);
    root.appendChild(div);
    updatePickLabel(slot.id);
  }
  buildPreviews();
  buildProvenance();
}

/* -- The prompt that produced these candidates, reviewable in place -- */
function buildProvenance() {
  const g = session.generation;
  if (!g) return;
  const box = document.getElementById('provenance');
  box.hidden = false;
  const bits = [];
  if (g.model) bits.push(['model', g.model]);
  if (g.size) bits.push(['size', g.size]);
  if (g.refs?.length) bits.push(['references', g.refs.join(', ') + ' (first has highest fidelity)']);
  if (g.cells) bits.push(['cells requested', g.cells]);
  if (g.prompt) bits.push(['prompt length', g.prompt.length + ' chars']);
  document.getElementById('gen-meta').innerHTML =
    bits.map(([k, v]) => `<span class="gen-k">${k}</span><span class="gen-v">${v}</span>`).join('');
  document.getElementById('gen-prompt').textContent = g.prompt ?? '(prompt not recorded)';
}

function updatePickLabel(slotId) {
  const el = document.getElementById(`pick-${slotId}`);
  if (!el) return;
  const v = selections[slotId];
  el.textContent = v === 'gap' ? 'GAP' : v;
  el.classList.toggle('gap', v === 'gap');
}

function select(slotId, value) {
  selections[slotId] = value;
  const [candId, flip] = value.split(':');
  document.querySelectorAll(`[data-slot="${slotId}"]`).forEach((el) => {
    const on = el.dataset.cand === candId;
    el.classList.toggle('selected', on);
    el.classList.toggle('flipped', on && flip === 'flip');
  });
  updatePickLabel(slotId);
}

/* -- Live animation preview: plays each defined cycle from current picks -- */
function buildPreviews() {
  // default: one cycle over every slot in order, if the spec didn't define any
  const defs = session.previews?.length
    ? session.previews
    : [{ label: 'all slots', slots: session.slots.map((s) => s.id) }];
  const host = document.getElementById('previews');
  const bar = document.getElementById('preview-bar');
  bar.hidden = false;
  const first = images.values().next().value;
  const w = first?.naturalWidth || 32, h = first?.naturalHeight || 48;
  const scale = Math.max(1, Math.min(4, Math.floor(160 / h)));

  const canvases = defs.map((def) => {
    const wrap = document.createElement('div');
    wrap.className = 'preview';
    const cv = document.createElement('canvas');
    cv.width = w * scale; cv.height = h * scale;
    const label = document.createElement('span');
    label.textContent = def.label ?? 'preview';
    wrap.append(cv, label);
    host.appendChild(wrap);
    return { def, ctx: cv.getContext('2d'), cv };
  });

  let tick = 0;
  const draw = () => {
    for (const { def, ctx, cv } of canvases) {
      const slotIds = def.slots ?? [];
      const pick = selections[slotIds[tick % slotIds.length]] ?? 'gap';
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.imageSmoothingEnabled = false;
      if (pick === 'gap') {
        ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--text-muted');
        ctx.font = `${10 * scale / 2}px monospace`;
        ctx.fillText('gap', cv.width / 2 - 12, cv.height / 2);
        continue;
      }
      const [cid, flip] = pick.split(':');
      const im = images.get(cid);
      if (!im) continue;
      ctx.save();
      const mirror = flip === 'flip' ? !def.flip : !!def.flip;
      if (mirror) { ctx.translate(cv.width, 0); ctx.scale(-1, 1); }
      ctx.drawImage(im, 0, 0, cv.width, cv.height);
      ctx.restore();
    }
    tick++;
  };
  draw();
  let timer = setInterval(draw, 1000 / fps);
  const fpsInput = document.getElementById('fps');
  fpsInput.oninput = () => {
    fps = Number(fpsInput.value);
    document.getElementById('fps-val').textContent = fps;
    clearInterval(timer);
    timer = setInterval(draw, 1000 / fps);
  };
}

document.getElementById('save').onclick = async () => {
  const res = await fetch(`/api/casting/${id}/verdict`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ selections }),
  });
  const v = (await res.json()).data;
  const out = document.getElementById('result');
  out.style.display = 'block';
  out.textContent = `Saved — agreement with predictions: ${v.agreement.matches}/${v.agreement.total} (${v.agreement.pct}%)` +
    (v.agreement.disagreements.length
      ? '\nOverrides:\n' + v.agreement.disagreements.map((d) => `  ${d.slot}: predicted ${d.predicted} → you chose ${d.selected}`).join('\n')
      : '\nFull agreement — detector calibrated.');
  document.getElementById('save').disabled = true;
};

load();
</script>
</body>
</html>
