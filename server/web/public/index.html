<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2e4be8">
  <title>Agent Sprites — Editor</title>
  <link rel="icon" href="branding/sprite.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/workbench.css">
</head>
<body>
  <header id="top-bar">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span class="brand-name">agent sprites</span></h1>
    <span id="project-name">No project loaded</span>
    <div id="top-bar-right">
      <button id="undo-btn" title="Undo (Ctrl/Cmd+Z)" aria-label="Undo" class="topbar-btn">↶</button>
      <button id="redo-btn" title="Redo (Ctrl/Cmd+Shift+Z)" aria-label="Redo" class="topbar-btn">↷</button>
      <span id="connection-status" class="disconnected">Disconnected</span>
      <button id="theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">☀</button>
    </div>
  </header>

  <nav id="design-bar" aria-label="Design workspace">
    <button data-workbench="sessions">Sessions</button>
    <button data-workbench="palettes">All palettes</button>
    <button data-workbench="tools">All tools</button>
    <button data-workbench="handoff">Pass design</button>
    <span id="session-indicator">No active session</span>
    <button id="save-project-btn">Save project</button>
  </nav>
  <aside id="workbench-mount"></aside>

  <div id="workspace">
    <aside id="left-panel">
      <section id="tool-palette">
        <h2>Tools</h2>
        <div id="tool-buttons"></div>
      </section>
      <section id="color-palette">
        <h2>Palette</h2>
        <div id="active-color">
          <div id="active-color-swatch"></div>
          <span id="active-color-name">—</span>
        </div>
        <div id="palette-swatches"></div>
      </section>
    </aside>

    <main id="center-panel">
      <div id="center-tabs">
        <button class="tab-btn active" data-tab="editor">Editor</button>
        <button class="tab-btn" data-tab="preview">Preview</button>
        <div id="source-visibility" title="View only: saved artwork and exports retain all shapes. Traced baseline uses the generated trace-000001 rectangle names.">
          <label><input id="show-traced-baseline" type="checkbox" checked> Show traced baseline</label>
          <label><input id="show-reference-image" type="checkbox" checked> Show reference image</label>
          <span>View only</span>
        </div>
      </div>
      <div id="center-tab-editor" class="tab-content active">
        <div id="canvas-container">
          <canvas id="editor-canvas"></canvas>
        </div>
        <div id="canvas-info">
          <span id="cursor-pos">—</span>
          <span id="zoom-level">1x</span>
          <span id="cell-ref">—</span>
        </div>
      </div>
      <div id="center-tab-preview" class="tab-content">
        <label class="preview-sequence-control">Sequence <select id="preview-sequence" aria-label="Preview sequence"></select></label>
        <div id="full-preview-mount"></div>
      </div>
    </main>

    <aside id="right-panel">
      <section id="shape-list">
        <h2>Shapes</h2>
        <input id="shape-search" type="search" placeholder="Find a shape" aria-label="Find a shape">
        <div id="shape-pagination"></div>
        <ul id="shape-items"></ul>
      </section>
      <section id="group-panel">
        <h2 title="Named sequences of cells — play them as animations">
          Animation Groups
          <span class="panel-hint">cross-frame</span>
        </h2>
        <ul id="group-items"></ul>
      </section>
      <section id="shape-group-panel">
        <h2 title="Shapes bundled into groups within a cell — move/recolor as a unit">
          Shape Groups
          <span class="panel-hint" id="shape-group-scope">in —</span>
        </h2>
        <ul id="shape-group-items"></ul>
      </section>
      <section id="anim-panel"></section>
    </aside>
  </div>

  <footer id="bottom-bar">
    <div id="cell-strip"></div>
    <div id="workbench-status" role="status" aria-live="polite">Choose a session, create a design, or import an editable project.</div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
