<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Sprites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="top-bar">
    <h1>Agent Sprites</h1>
    <span id="project-name">No project loaded</span>
    <div id="top-bar-right">
      <button id="undo-btn" title="Undo (Ctrl/Cmd+Z)" class="topbar-btn">↶</button>
      <button id="redo-btn" title="Redo (Ctrl/Cmd+Shift+Z)" class="topbar-btn">↷</button>
      <span id="connection-status" class="disconnected">Disconnected</span>
      <button id="theme-toggle" title="Toggle light/dark mode">☀</button>
    </div>
  </header>

  <div id="workspace">
    <aside id="left-panel">
      <section id="tool-palette">
        <h2>Tools</h2>
        <div id="tool-buttons"></div>
      </section>
      <section id="color-palette">
        <h2>Palette</h2>
        <div id="active-color">
          <div id="active-color-swatch"></div>
          <span id="active-color-name">—</span>
        </div>
        <div id="palette-swatches"></div>
      </section>
    </aside>

    <main id="center-panel">
      <div id="center-tabs">
        <button class="tab-btn active" data-tab="editor">Editor</button>
        <button class="tab-btn" data-tab="preview">Preview</button>
      </div>
      <div id="center-tab-editor" class="tab-content active">
        <div id="canvas-container">
          <canvas id="editor-canvas"></canvas>
        </div>
        <div id="canvas-info">
          <span id="cursor-pos">—</span>
          <span id="zoom-level">1x</span>
          <span id="cell-ref">—</span>
        </div>
      </div>
      <div id="center-tab-preview" class="tab-content">
        <div id="full-preview-mount"></div>
      </div>
    </main>

    <aside id="right-panel">
      <section id="shape-list">
        <h2>Shapes</h2>
        <ul id="shape-items"></ul>
      </section>
      <section id="group-panel">
        <h2 title="Named sequences of cells — play them as animations">
          Animation Groups
          <span class="panel-hint">cross-frame</span>
        </h2>
        <ul id="group-items"></ul>
      </section>
      <section id="shape-group-panel">
        <h2 title="Shapes bundled into groups within a cell — move/recolor as a unit">
          Shape Groups
          <span class="panel-hint" id="shape-group-scope">in —</span>
        </h2>
        <ul id="shape-group-items"></ul>
      </section>
      <section id="anim-panel"></section>
    </aside>
  </div>

  <footer id="bottom-bar">
    <div id="cell-strip"></div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
